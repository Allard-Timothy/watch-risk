{% extends "base/base.html" %}

{% block title %}Log in | WatchRisk{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1>Log in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
  </div>
</div>
{% endblock %}

{% extends "base/base.html" %}

{% block title %}Cases | WatchTell{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Cases</h1>
  <a class="btn btn-primary" href="{% url 'cases:create' %}">New case</a>
</div>

{% if cases %}
  <div class="list-group">
    {% for case in cases %}
      <a class="list-group-item list-group-item-action" href="{{ case.get_absolute_url }}">
        <div class="d-flex justify-content-between">
          <strong>{{ case }}</strong>
          <span class="badge text-bg-secondary">{{ case.status }}</span>
        </div>
        <div class="text-muted">{{ case.created_at }}</div>
      </a>
    {% endfor %}
  </div>
{% else %}
  <p>No cases yet.</p>
{% endif %}
{% endblock %}

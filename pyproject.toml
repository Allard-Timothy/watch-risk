[project]
name = "watch-risk"
version = "0.1.0"
description = "Pre-purchase risk reports for luxury watch buyers."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "psycopg[binary]>=3.2.0",
    "dj-database-url>=2.3.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "openai>=1.99.0",
    "stripe>=11.0.0",
    "google-cloud-storage>=2.18.0",
    "gunicorn>=23.0.0",
    "whitenoise>=6.8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "black>=24.10.0",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "mypy>=1.13.0",
    "djlint>=1.36.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
